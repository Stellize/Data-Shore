# A minimal two-service shore.
#
#   1. Put your files in ./docker/archive and edit docker/node.datashore.json.
#   2. docker compose up --build
#   3. Open the hub at http://localhost:8787, sign in, and pair the node using
#      URL http://node:4770 plus the token from docker/node.datashore.json.
#
# The node mounts your archive read-only, so a bug could not write to it even
# if one existed.
services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    ports:
      - "8787:8787"
    environment:
      DATA_SHORE_ADMIN_PASSWORD: ${DATA_SHORE_ADMIN_PASSWORD:?set a strong console password}
    volumes:
      - hub-data:/data
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    volumes:
      - ./docker/archive:/shares/archive:ro
      - ./docker/node.datashore.json:/config/datashore.node.json:ro
    expose:
      - "4770"
    restart: unless-stopped

volumes:
  hub-data:
